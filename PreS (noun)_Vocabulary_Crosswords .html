<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PreS Vocabulary Crosswords</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a school exercise page. Set tabs on top, the grid on the left
   like a sheet of squared paper, clues on the right, tools under the grid. */
:root {
  --paper: #eef1f8;
  --card: #ffffff;
  --ink: #1b2440;
  --muted: #5a6486;
  --line: #c5cde2;
  --accent: #2f5bea;
  --accent-ink: #ffffff;
  --hl: #fff0b0;
  --hl-strong: #ffd34d;
  --good: #14845a;
  --good-bg: #dcf5ea;
  --bad: #c5334a;
  --bad-bg: #fde3e7;
  --font-display: "Baloo 2", "Be Vietnam Pro", "Segoe UI", Tahoma, sans-serif;
  --font-body: "Be Vietnam Pro", "Segoe UI", Tahoma, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12162a;
    --card: #1b2139;
    --ink: #e9edfa;
    --muted: #a0aacb;
    --line: #3a4365;
    --accent: #8aa4ff;
    --accent-ink: #10142a;
    --hl: #4b4526;
    --hl-strong: #8f7a1c;
    --good: #5fd6a8;
    --good-bg: #173c30;
    --bad: #ff8b9b;
    --bad-bg: #47202a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12162a;
  --card: #1b2139;
  --ink: #e9edfa;
  --muted: #a0aacb;
  --line: #3a4365;
  --accent: #8aa4ff;
  --accent-ink: #10142a;
  --hl: #4b4526;
  --hl-strong: #8f7a1c;
  --good: #5fd6a8;
  --good-bg: #173c30;
  --bad: #ff8b9b;
  --bad-bg: #47202a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
}
.page { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 20px; }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-size: clamp(1.7rem, 4vw, 2.3rem); line-height: 1.1; margin: 0; text-wrap: balance; }
.lead { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }
.level { font-weight: 600; font-size: .85rem; border: 1.5px solid var(--ink); border-radius: 999px; padding: 2px 12px; white-space: nowrap; }

nav.levels { display: flex; flex-direction: column; gap: 14px; }
.level-name { margin: 0 0 6px; font-weight: 700; font-size: .85rem; letter-spacing: .04em; text-transform: uppercase; }
.level-name small { font-weight: 500; font-size: .85rem; color: var(--muted); letter-spacing: 0; text-transform: none; margin-left: 6px; }
.sets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.gap { display: inline-block; width: 3.2em; border-bottom: 2px solid currentColor; margin: 0 2px; }
.tab {
  font: inherit; color: var(--ink); text-align: left; cursor: pointer;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.tab:hover { border-color: var(--accent); }
.tab[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 -4px 0 var(--accent); }
.tab .no { font-size: .75rem; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.tab .name { font-family: var(--font-display); font-size: 1.1rem; line-height: 1.15; }
.tab .count { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tab.done .count { color: var(--good); font-weight: 600; }

.board { display: grid; grid-template-columns: minmax(0, auto) minmax(260px, 1fr); gap: 24px; align-items: start; }
.sheet { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.sheet h2 { font-family: var(--font-display); font-size: 1.35rem; line-height: 1.2; margin: 0; }
.sheet h2 small { font-family: var(--font-body); font-weight: 500; font-size: .9rem; color: var(--muted); margin-left: 8px; }
.how { margin: 0; color: var(--muted); font-size: .92rem; }

.grid-wrap { overflow-x: auto; background: var(--paper); border-radius: 12px; padding: 12px; }
.grid {
  --cell: clamp(20px, calc((100vw - 96px) / var(--cols)), 40px);
  display: grid; grid-template-columns: repeat(var(--cols), var(--cell)); grid-auto-rows: var(--cell);
  width: max-content;
}
.cell { position: relative; border: 1.5px solid var(--ink); margin: -0.75px; background: var(--card); }
.cell .num { position: absolute; top: 1px; left: 2px; font-size: calc(var(--cell) * .27); line-height: 1; font-weight: 600; color: var(--muted); pointer-events: none; z-index: 1; }
.cell input {
  position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: calc(var(--cell) * .18) 0 0; margin: 0;
  background: transparent; color: var(--ink); text-align: center; text-transform: uppercase; caret-color: transparent;
  font-family: var(--font-body); font-weight: 700; font-size: calc(var(--cell) * .52); border-radius: 0;
}
.cell.in-word { background: var(--hl); }
.cell input:focus { outline: none; }
.cell:focus-within { background: var(--hl-strong); z-index: 2; box-shadow: 0 0 0 2px var(--accent); }
.cell.ok input { color: var(--good); }
.cell.ok { background: var(--good-bg); }
.cell.wrong input { color: var(--bad); }
.cell.wrong { background: var(--bad-bg); }

.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  font: inherit; font-weight: 600; font-size: .92rem; cursor: pointer; color: var(--ink);
  background: var(--card); border: 1.5px solid var(--ink); border-radius: 10px; padding: 8px 14px;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn.armed { border-color: var(--bad); color: var(--bad); }
.btn:focus-visible, .tab:focus-visible, .clue:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.status { min-height: 1.5em; margin: 0; font-weight: 600; }
.status.good { color: var(--good); }
.status.bad { color: var(--bad); }

.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.clues { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px 20px; }
.clues h3 { font-family: var(--font-display); font-size: 1.1rem; margin: 0 0 6px; display: flex; align-items: baseline; gap: 8px; }
.clues h3 small { font-family: var(--font-body); font-weight: 500; font-size: .85rem; color: var(--muted); }
.clues ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.clue {
  font: inherit; color: var(--ink); background: transparent; border: 0; border-radius: 8px; cursor: pointer;
  width: 100%; text-align: left; padding: 5px 8px; display: grid; grid-template-columns: 1.8em 1fr auto; gap: 4px; align-items: baseline;
}
.clue:hover { background: var(--paper); }
.clue .n { font-weight: 700; font-variant-numeric: tabular-nums; }
.clue .len { color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
.clue.active { background: var(--hl); }
.clue.solved .t { color: var(--muted); text-decoration: line-through; }
.clue.solved .len { color: var(--good); font-weight: 700; }

footer.note { color: var(--muted); font-size: .88rem; max-width: 70ch; }

@media (max-width: 860px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  .sets { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 420px) {
  .sheet { padding: 12px; }
  .grid-wrap { padding: 8px; }
  .grid { --cell: clamp(19px, calc((100vw - 78px) / var(--cols)), 40px); }
}
@media (prefers-reduced-motion: no-preference) {
  .cell { transition: background-color .12s; }
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <h1>PreS Vocabulary Crosswords</h1>
      <p class="lead">Các ô chữ ôn danh từ trong danh sách PreS.</p>
    </div>
    <span class="level">Level A0–A1</span>
  </header>

  <nav class="levels" id="tabs" aria-label="Chọn bộ ô chữ"></nav>

  <main class="board">
    <section class="sheet" aria-labelledby="set-title">
      <h2 id="set-title"></h2>
      <p class="how" id="how"></p>
      <div class="grid-wrap"><div class="grid" id="grid"></div></div>
      <div class="tools">
        <button class="btn primary" id="btn-check" type="button">Kiểm tra</button>
        <button class="btn" id="btn-reset" type="button">Làm lại</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>

    <aside class="side">
      <section class="sheet">
        <div class="clues">
          <div><h3>Across <small>Hàng ngang</small></h3><ol id="clues-A"></ol></div>
          <div><h3>Down <small>Hàng dọc</small></h3><ol id="clues-D"></ol></div>
        </div>
      </section>
    </aside>
  </main>

  <footer class="note">Số trong ngoặc là số chữ cái của từ. </footer>
</div>

const STORE = 'pres-crossword-v1';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { saved = {}; }
function persist() { try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch (e) {} }

const $ = id => document.getElementById(id);
const key = (r, c) => r + ',' + c;

// Pre-compute cells for every entry
PUZZLES.forEach(p => {
  p.cellEntries = {};
  p.entries.forEach((e, i) => {
    e.i = i;
    e.cells = [...e.w].map((ch, k) => e.d === 'A' ? [e.r, e.c + k] : [e.r + k, e.c]);
    e.cells.forEach(([r, c]) => { (p.cellEntries[key(r, c)] ||= {})[e.d] = e; });
  });
  saved[p.id] ||= { a: {} };
  saved[p.id].a ||= {};
});

let P = null;          // current puzzle
let cur = null;        // [r, c]
let dir = 'A';

const sol = (r, c) => P.rows[r][c];
const ans = (r, c) => saved[P.id].a[key(r, c)] || '';
const entrySolved = (p, e) => e.cells.every(([r, c]) => (saved[p.id].a[key(r, c)] || '') === p.rows[r][c]);
const solvedCount = p => p.entries.filter(e => entrySolved(p, e)).length;

function buildTabs() {
  const nav = $('tabs');
  nav.innerHTML = '';
  LEVELS.forEach(L => {
    const group = document.createElement('div');
    group.innerHTML = `<p class="level-name">${L.name}<small>${L.note}</small></p>`;
    const row = document.createElement('div');
    row.className = 'sets'; row.setAttribute('role', 'tablist'); row.setAttribute('aria-label', L.name);
    PUZZLES.forEach((p, i) => {
      if (p.kind !== L.kind) return;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'tab'; b.id = 'tab-' + p.id; b.setAttribute('role', 'tab');
      b.innerHTML = `<span class="no">Bộ ${i + 1}</span><span class="name" lang="en">${esc(p.title)}</span><span class="count"></span>`;
      b.addEventListener('click', () => { location.hash = p.id; show(p.id); });
      row.appendChild(b);
    });
    group.appendChild(row); nav.appendChild(group);
  });
  refreshTabs();
}

    const b = $('tab-' + p.id);
    const n = solvedCount(p);
    b.querySelector('.count').textContent = n === p.entries.length ? `Hoàn thành ${n}/${n} từ` : `${n}/${p.entries.length} từ`;
    b.classList.toggle('done', n === p.entries.length);
    b.setAttribute('aria-selected', String(P && P.id === p.id));
  });
}

function show(id) {
  P = PUZZLES.find(p => p.id === id) || PUZZLES[0];
  cur = null; inputs = {}; cells = {};
  const idx = PUZZLES.indexOf(P);
  $('set-title').innerHTML = `Bộ ${idx + 1}: <span lang="en">${esc(P.title)}</span><small>${esc(P.vi)}</small>`;
  $('how').textContent = HOW[P.kind];

  const g = $('grid');
  g.style.setProperty('--cols', P.w);
  g.innerHTML = '';
  const nums = {};
  P.entries.forEach(e => { nums[key(e.r, e.c)] = e.n; });
  for (let r = 0; r < P.h; r++) for (let c = 0; c < P.w; c++) {
    if (sol(r, c) === '.') { g.appendChild(document.createElement('div')); continue; }
    const k = key(r, c);
    const d = document.createElement('div'); d.className = 'cell';
    if (nums[k]) { const s = document.createElement('span'); s.className = 'num'; s.textContent = nums[k]; d.appendChild(s); }
    const inp = document.createElement('input');
    inp.id = `c-${P.id}-${r}-${c}`; inp.type = 'text'; inp.maxLength = 2; inp.autocomplete = 'off';
    inp.setAttribute('autocapitalize', 'characters'); inp.setAttribute('autocorrect', 'off'); inp.spellcheck = false;
    inp.setAttribute('aria-label', `Hàng ${r + 1}, cột ${c + 1}`);
    inp.value = ans(r, c);
    inp.addEventListener('pointerdown', () => { if (cur && cur[0] === r && cur[1] === c && document.activeElement === inp) flip(); });
    inp.addEventListener('focus', () => select(r, c));
    inp.addEventListener('input', () => onType(r, c, inp));
    inp.addEventListener('keydown', ev => onKey(ev, r, c));
    d.appendChild(inp); g.appendChild(d);
    inputs[k] = inp; cells[k] = d;
  }

  ['A', 'D'].forEach(D => {
    const ol = $('clues-' + D); ol.innerHTML = '';
    P.entries.filter(e => e.d === D).forEach(e => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'clue'; b.id = `clue-${e.i}`;
      b.innerHTML = `<span class="n">${e.n}.</span><span class="t"${P.kind === 'ctx' ? ' lang="en"' : ''}>${clueHtml(e)}</span><span class="len">(${e.w.length})</span>`;
      b.addEventListener('click', () => {
        dir = e.d;
        const target = e.cells.find(([r, c]) => ans(r, c) !== sol(r, c)) || e.cells[0];
        inputs[key(...target)].focus();
      });
      li.appendChild(b); ol.appendChild(li);
    });
  });

  disarm(); setStatus('');
  refreshSolved(); refreshTabs();
}

function select(r, c) {
  const ents = P.cellEntries[key(r, c)];
  if (!ents[dir]) dir = dir === 'A' ? 'D' : 'A';
  cur = [r, c];
  paint();
}
function flip() {
  const ents = P.cellEntries[key(...cur)];
  const other = dir === 'A' ? 'D' : 'A';
  if (ents[other]) { dir = other; paint(); }
}
function paint() {
  Object.values(cells).forEach(d => d.classList.remove('in-word'));
  document.querySelectorAll('.clue.active').forEach(b => b.classList.remove('active'));
  if (!cur) return;
  const e = P.cellEntries[key(...cur)][dir];
  e.cells.forEach(([r, c]) => cells[key(r, c)].classList.add('in-word'));
  const b = $('clue-' + e.i);
  b.classList.add('active');
}

function setCell(r, c, ch) {
  const k = key(r, c);
  if (ch) saved[P.id].a[k] = ch; else delete saved[P.id].a[k];
  inputs[k].value = ch;
  cells[k].classList.remove('ok', 'wrong');
}

function onType(r, c, inp) {
  const letters = inp.value.toUpperCase().replace(/[^A-Z]/g, '');
  const ch = letters.slice(-1);
  setCell(r, c, ch);
  persist(); disarm(); setStatus('');
  refreshSolved(); refreshTabs();
  if (ch) step(1);
  celebrate();
}
function step(delta) {
  const e = P.cellEntries[key(...cur)][dir];
  const i = e.cells.findIndex(([r, c]) => r === cur[0] && c === cur[1]) + delta;
  if (i >= 0 && i < e.cells.length) inputs[key(...e.cells[i])].focus();
}
function onKey(ev, r, c) {
  const moves = { ArrowLeft: [0, -1, 'A'], ArrowRight: [0, 1, 'A'], ArrowUp: [-1, 0, 'D'], ArrowDown: [1, 0, 'D'] };
  if (moves[ev.key]) {
    ev.preventDefault();
    const [dr, dc, d] = moves[ev.key];
    const next = inputs[key(r + dr, c + dc)];
    if (P.cellEntries[key(r, c)][d]) dir = d;
    if (next) next.focus(); else paint();
  } else if (ev.key === 'Backspace') {
    ev.preventDefault();
    if (ans(r, c)) { setCell(r, c, ''); }
    else { step(-1); if (cur) setCell(cur[0], cur[1], ''); }
    persist(); refreshSolved(); refreshTabs(); setStatus('');
  } else if (ev.key === ' ' || ev.key === 'Enter') {
    ev.preventDefault(); flip();
  }
}

function refreshSolved() {
  P.entries.forEach(e => $('clue-' + e.i).classList.toggle('solved', entrySolved(P, e)));
}
function setStatus(text, cls) {
  const s = $('status'); s.textContent = text; s.className = 'status' + (cls ? ' ' + cls : '');
}
function celebrate() {
  if (solvedCount(P) === P.entries.length) setStatus('Giỏi lắm! Bạn đã hoàn thành bộ này. Well done!', 'good');
}

function check() {
  disarm();
  let filled = 0, wrong = 0;
  for (const k in inputs) {
    const [r, c] = k.split(',').map(Number);
    const a = ans(r, c);
    cells[k].classList.remove('ok', 'wrong');
    if (!a) continue;
    filled++;
    if (a === sol(r, c)) cells[k].classList.add('ok'); else { cells[k].classList.add('wrong'); wrong++; }
  }
  const n = solvedCount(P), total = P.entries.length;
  if (!filled) setStatus('Bạn chưa điền ô nào. Hãy thử một từ dễ trước nhé.');
  else if (n === total) setStatus('Giỏi lắm! Bạn đã hoàn thành bộ này. Well done!', 'good');
  else if (wrong) setStatus(`Đúng ${n}/${total} từ. Có ${wrong} chữ cái sai (ô màu đỏ), hãy sửa lại.`, 'bad');
  else setStatus(`Đúng ${n}/${total} từ. Các chữ đã điền đều đúng, làm tiếp nhé!`, 'good');
}
// Two-step buttons instead of confirm dialogs
let armed = null;
function disarm() {
  if (!armed) return;
  armed.btn.textContent = armed.label; armed.btn.classList.remove('armed'); armed = null;
}
function twoStep(btn, question, action) {
  btn.addEventListener('click', () => {
    if (armed && armed.btn === btn) { disarm(); action(); return; }
    disarm();
    armed = { btn, label: btn.textContent };
    btn.textContent = question; btn.classList.add('armed');
  });
}
twoStep($('btn-reset'), 'Bấm lần nữa để xóa bài làm', () => {
  saved[P.id] = { a: {} }; persist(); show(P.id);
});
$('btn-check').addEventListener('click', check);

function route() { show((location.hash || '').slice(1)); }
window.addEventListener('hashchange', route);
buildTabs(); route();
</script>
</body>
</html>
